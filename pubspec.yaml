name: meallens
description: "MealLens: scan your fridge, cook what you have."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  google_fonts: 9.0.0
  shared_preferences: 2.5.6
  supabase_flutter: 2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    # Nunito Sans, bundled so the app never fetches fonts at runtime (google_fonts looks here first).
    - assets/google_fonts/

# Native launch screen, matching the in-app splash. Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F3F6F3"
  image: assets/brand/splash_mark.png
  color_dark: "#181B1A"
  image_dark: assets/brand/splash_mark_dark.png
  android_12:
    color: "#F3F6F3"
    image: assets/brand/splash_mark.png
    color_dark: "#181B1A"
    image_dark: assets/brand/splash_mark_dark.png
  web: false

# App icon. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#F3F6F3"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  remove_alpha_ios: true
